<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mazin Atelier — Boutique</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --wall: #d8d2c8;
    --ink: #23201c;
    --muted: #6d655b;
    --tag: #23201c;
    --tag-text: #f3efe8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--wall); }
  body { font-family: "Jost", system-ui, sans-serif; color: var(--ink); }

  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 22px 28px; pointer-events: none;
  }
  header a { pointer-events: auto; color: inherit; text-decoration: none; }
  .wordmark { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.7rem; font-weight: 600; letter-spacing: .02em; }
  .hint { font-size: .9rem; color: var(--muted); }

  #price-tag-hud {
    position: fixed; top: 0; left: 0; z-index: 10;
    pointer-events: none; opacity: 0;
    transition: opacity .18s ease;
    background: var(--tag); color: var(--tag-text);
    padding: 10px 14px; border-radius: 3px;
    min-width: 120px; white-space: nowrap;
    will-change: transform;
  }
  #price-tag-hud.visible { opacity: 1; }
  #price-tag-hud .name { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.15rem; font-weight: 600; line-height: 1.1; }
  #price-tag-hud .price { font-size: .95rem; margin-top: 3px; }

  #status {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 6; font-size: .9rem; color: var(--muted);
    text-align: center; max-width: 90vw;
  }
  #status.error { color: #8a1f1f; }

  @media (prefers-reduced-motion: reduce) { #price-tag-hud { transition: none; } }
</style>

<!--
  IMPORTANT: the import map MUST come before the module script.
  Three.js is pinned to an exact version (0.160.0). Modern Three.js no longer ships
  a global "THREE" script, which is what caused "THREE is not defined".
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<header>
  <a href="index.html" class="wordmark">Mazin Atelier</a>
  <span class="hint">Move your cursor across the rail</span>
</header>

<canvas id="stage"></canvas>

<div id="price-tag-hud" aria-hidden="true">
  <div class="name"></div>
  <div class="price"></div>
</div>

<div id="status">Loading garments…</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* ============================================================
   CONFIG — edit these
   ============================================================ */
const MODEL_URL = "models/tshirt.glb";        // must sit in the same folder as boutique.html
const GARMENT_HEIGHT = 2.2;            // every garment is auto-scaled to this height
const RAIL_Y = 1.75;                   // height of the rail
const SPACING = 2.5;                   // distance between garments

const GARMENTS = [
  { name: "Ink Tee",    price: "$48", color: 0x1f2a44 },
  { name: "Clay Tee",   price: "$48", color: 0xa8573a },
  { name: "Bone Tee",   price: "$52", color: 0xe9e2d3 },
  { name: "Moss Tee",   price: "$54", color: 0x4d5a3c },
];

/* ============================================================
   DOM
   ============================================================ */
const canvas = document.getElementById("stage");
const hud = document.getElementById("price-tag-hud");
const hudName = hud.querySelector(".name");
const hudPrice = hud.querySelector(".price");
const statusEl = document.getElementById("status");

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d2c8);   // same as --wall, so it is never a black screen

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
const LOOK_AT = new THREE.Vector3(0, 0.55, 0);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // keep the whole rail visible on narrow screens
  const railWidth = (GARMENTS.length - 1) * SPACING + 3;
camera.position.set(0, 1.2, 9.5);
camera.lookAt(new THREE.Vector3(0, 0.8, 0));
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

/* ============================================================
   LIGHTS
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8afa2, 1.0));

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3, 6, 6);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 6;   key.shadow.camera.bottom = -4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xfff1de, 0.7);
fill.position.set(-5, 2, 4);
scene.add(fill);

/* ============================================================
   RAIL
   ============================================================ */
const railLength = (GARMENTS.length - 1) * SPACING + 4;
const rail = new THREE.Mesh(
  new THREE.CylinderGeometry(0.035, 0.035, railLength, 24),
  new THREE.MeshStandardMaterial({ color: 0x2b2824, metalness: 0.8, roughness: 0.35 })
);
rail.rotation.z = Math.PI / 2;
rail.position.set(0, RAIL_Y + 0.12, 0);
scene.add(rail);

/* ============================================================
   GARMENTS
   Each garment = pivot group placed at the rail.
   The GLB origin is the collar line (0,0,0), so the pivot rotates from the hanger.
   ============================================================ */
const pivots = [];            // one per garment
const hoverables = [];        // every mesh the raycaster tests

function makeHanger() {
  const g = new THREE.Group();
  const metal = new THREE.MeshStandardMaterial({ color: 0x2b2824, metalness: 0.8, roughness: 0.35 });
  const hook = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.012, 8, 24, Math.PI * 1.5), metal);
  hook.position.y = 0.19;
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.1, 8), metal);
  stem.position.y = 0.07;
  g.add(hook, stem);
  return g;
}

function buildGarment(source, index) {
  const data = GARMENTS[index];
  const pivot = new THREE.Group();
  pivot.position.set((index - (GARMENTS.length - 1) / 2) * SPACING, RAIL_Y, 0);
  pivot.userData = { index, hover: 0, spin: 0, phase: Math.random() * Math.PI * 2 };

  const model = source.clone(true);

  // Auto-normalise size so any Blender export scale works
  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3(); box.getSize(size);
  const s = GARMENT_HEIGHT / (size.y || 1);
  model.scale.setScalar(s);
  // Shift the mesh downward so the top collar line rests perfectly on the rail hanger
model.position.y = -GARMENT_HEIGHT;

  const material = new THREE.MeshStandardMaterial({
    color: data.color, roughness: 0.85, metalness: 0, side: THREE.DoubleSide
  });

  model.traverse((o) => {
    if (o.isMesh) {
      o.material = material;
      o.castShadow = true;
      o.receiveShadow = true;
      o.userData.pivot = pivot;
      hoverables.push(o);
    }
  });

  pivot.add(model, makeHanger());
  scene.add(pivot);
  pivots.push(pivot);
}

// Fallback so the page is never empty if the .glb is missing or blocked
function makeFallback() {
  const geo = new THREE.CylinderGeometry(0.55, 0.62, 1, 32, 1, true);
  geo.translate(0, -0.5, 0);
  const m = new THREE.Mesh(geo);
  const g = new THREE.Group(); g.add(m);
  return g;
}

function buildAll(source) {
  GARMENTS.forEach((_, i) => buildGarment(source, i));
  statusEl.textContent = "";
}

new GLTFLoader().load(
  MODEL_URL,
  (gltf) => buildAll(gltf.scene),
  undefined,
  (err) => {
    console.error("Could not load " + MODEL_URL, err);
    buildAll(makeFallback());
    statusEl.classList.add("error");
    statusEl.textContent = "Couldn’t load " + MODEL_URL + " — showing placeholder shapes. Check the file name and that it sits next to boutique.html.";
  }
);

/* ============================================================
   MOUSE / TOUCH TRACKING + RAYCASTER
   ============================================================ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2(0, 0);       // normalised mouse (-1..1)
const smoothNdc = new THREE.Vector2(0, 0); // eased mouse
const hudPos = { x: 0, y: 0, tx: 0, ty: 0 };
let hovered = null;
let pointerSeen = false;

function onPointer(e) {
  const x = e.clientX, y = e.clientY;
  ndc.x = (x / window.innerWidth) * 2 - 1;
  ndc.y = -(y / window.innerHeight) * 2 + 1;
  hudPos.tx = x + 18;
  hudPos.ty = y + 18;
  if (!pointerSeen) { hudPos.x = hudPos.tx; hudPos.y = hudPos.ty; pointerSeen = true; }
}
window.addEventListener("pointermove", onPointer, { passive: true });
window.addEventListener("pointerdown", onPointer, { passive: true });
window.addEventListener("pointerleave", () => { ndc.set(0, 0); setHover(null); });

function setHover(pivot) {
  if (pivot === hovered) return;
  hovered = pivot;
  if (pivot) {
    const d = GARMENTS[pivot.userData.index];
    hudName.textContent = d.name;
    hudPrice.textContent = d.price;
    hud.classList.add("visible");
    canvas.style.cursor = "pointer";
  } else {
    hud.classList.remove("visible");
    canvas.style.cursor = "default";
  }
}

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const clock = new THREE.Clock();
const lerp = (a, b, t) => a + (b - a) * t;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  const k = 1 - Math.pow(0.001, dt);      // frame-rate independent easing

  smoothNdc.x = lerp(smoothNdc.x, ndc.x, k * 0.6);
  smoothNdc.y = lerp(smoothNdc.y, ndc.y, k * 0.6);

  // Raycast
  if (pivots.length && pointerSeen) {
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObjects(hoverables, false)[0];
    setHover(hit ? hit.object.userData.pivot : null);
  }

  // Garments
  pivots.forEach((p) => {
    const isHover = p === hovered;
    p.userData.hover = lerp(p.userData.hover, isHover ? 1 : 0, k * 1.2);
    const h = p.userData.hover;

    // Each garment turns toward the cursor, based on how far the cursor is from it
    const dx = smoothNdc.x - (p.position.x / (camera.position.z * 0.55));
    const turnToCursor = THREE.MathUtils.clamp(dx, -1, 1) * 0.55;

    // Gentle idle sway + hover spin
    const sway = reduceMotion ? 0 : Math.sin(t * 0.8 + p.userData.phase) * 0.05;
    if (isHover && !reduceMotion) p.userData.spin += dt * 1.1;

    p.rotation.y = turnToCursor + sway + p.userData.spin * h;
    p.rotation.z = lerp(p.rotation.z, -smoothNdc.x * 0.08 * (0.4 + h), k);
    p.rotation.x = lerp(p.rotation.x, smoothNdc.y * 0.06, k);

    const sc = 1 + h * 0.07;
    p.scale.setScalar(sc);
  });

  // Smooth HUD follow
  hudPos.x = lerp(hudPos.x, hudPos.tx, k * 1.5);
  hudPos.y = lerp(hudPos.y, hudPos.ty, k * 1.5);
  const maxX = window.innerWidth - hud.offsetWidth - 8;
  const maxY = window.innerHeight - hud.offsetHeight - 8;
  hud.style.transform =
    "translate3d(" + Math.min(hudPos.x, maxX).toFixed(1) + "px," + Math.min(hudPos.y, maxY).toFixed(1) + "px,0)";

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
