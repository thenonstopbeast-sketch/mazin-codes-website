<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mazin Atelier — Boutique</title>
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --wall: #d8d2c8;
    --ink: #23201c;
    --muted: #6d655b;
    --tag: #23201c;
    --tag-text: #f3efe8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--wall); }
  body { font-family: "Jost", system-ui, sans-serif; color: var(--ink); }

  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 22px 28px; pointer-events: none;
  }
  header a { pointer-events: auto; color: inherit; text-decoration: none; }
  .wordmark { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.7rem; font-weight: 600; letter-spacing: .02em; }
  .hint { font-size: .9rem; color: var(--muted); }

  #price-tag-hud {
    position: fixed; top: 0; left: 0; z-index: 10;
    pointer-events: none; opacity: 0;
    transition: opacity .18s ease;
    background: var(--tag); color: var(--tag-text);
    padding: 10px 14px; border-radius: 3px;
    min-width: 120px; white-space: nowrap;
    will-change: transform;
  }
  #price-tag-hud.visible { opacity: 1; }
  #price-tag-hud .name { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.15rem; font-weight: 600; line-height: 1.1; }
  #price-tag-hud .price { font-size: .95rem; margin-top: 3px; }

  #status {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 6; font-size: .9rem; color: var(--muted);
    text-align: center; max-width: 90vw;
  }
  #status.error { color: #8a1f1f; }

  .storefront-navigation {
    position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%);
    z-index: 20; display: flex; gap: 24px;
  }
  .nav-btn {
    background: var(--ink); color: var(--tag-text); border: 1px solid rgba(255,255,255,0.15);
    font-family: "Jost", sans-serif; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.12em;
    padding: 12px 26px; cursor: pointer; border-radius: 2px; transition: all 0.2s ease;
  }
  .nav-btn:hover { background: #3e3832; transform: translateY(-2px); }
  .nav-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { #price-tag-hud, .nav-btn { transition: none; } }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<header>
  <a href="index.html" class="wordmark">Mazin Atelier</a>
  <span class="hint">Move your cursor across the rail or use controls</span>
</header>

<canvas id="stage"></canvas>

<div id="price-tag-hud" aria-hidden="true">
  <div class="name"></div>
  <div class="price"></div>
</div>

<div class="storefront-navigation">
  <button id="prev-garment" class="nav-btn" type="button">← PREVIOUS</button>
  <button id="next-garment" class="nav-btn" type="button">NEXT →</button>
</div>

<div id="status">Loading garments…</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const GRAVITY = new THREE.Vector3(0, -9.8, 0);
const TIMESTEP = 0.016; 
let fabricParticles = [];
let fabricConstraints = [];
let activeGarmentMesh = null;

export function loadLuxuryGarments(scene, colorToken) {
    const loader = new GLTFLoader();
    loader.load('./models/tshirt.glb', (gltf) => {
        gltf.scene.traverse((child) => {
            if (child.isMesh) {
                activeGarmentMesh = child;
                child.material = new THREE.MeshPhysicalMaterial({
                    color: new THREE.Color(colorToken),
                    roughness: 0.8,
                    metalness: 0.1,
                    side: THREE.DoubleSide,
                    shadowSide: THREE.DoubleSide,
                    sheen: 1.0,
                    sheenRoughness: 0.65,
                    sheenColor: new THREE.Color(0xffffff)
                });
                child.castShadow = true;
                child.receiveShadow = true;
                buildClothSystem(child);
            }
        });
        scene.add(gltf.scene);
    }, undefined, (error) => console.error('Asset Pipeline Error:', error));
}

function buildClothSystem(mesh) {
    const geometry = mesh.geometry;
    const positionAttribute = geometry.attributes.position;
    const pinnedAttribute = geometry.attributes._PinnedShoulders; 
    
    fabricParticles = [];
    fabricConstraints = [];
    
    for (let i = 0; i < positionAttribute.count; i++) {
        let localPos = new THREE.Vector3().fromBufferAttribute(positionAttribute, i);
        let worldPos = localPos.clone().applyMatrix4(mesh.matrixWorld);
        
        let isPinned = false;
        if (pinnedAttribute && pinnedAttribute.getX(i) > 0) {
            isPinned = true;
        }

        fabricParticles.push({
            position: worldPos.clone(),
            previous: worldPos.clone(),
            acceleration: new THREE.Vector3(0, 0, 0),
            isPinned: isPinned
        });
    }

    const index = geometry.index;
    if (index) {
        for (let i = 0; i < index.count; i += 3) {
            const idxA = index.getX(i);
            const idxB = index.getY(i);
            const idxC = index.getZ(i);
            createLink(idxA, idxB);
            createLink(idxB, idxC);
            createLink(idxC, idxA);
        }
    }
}

function createLink(a, b) {
    const dist = fabricParticles[a].position.distanceTo(fabricParticles[b].position);
    fabricConstraints.push({ indexA: a, indexB: b, restLength: dist });
}

export function runBoutiqueFrameUpdate() {
    if (!activeGarmentMesh || fabricParticles.length === 0) return;

    for (let p of fabricParticles) {
        if (p.isPinned) continue;
        p.acceleration.add(GRAVITY);
        let currentPos = p.position.clone();
        let frameVelocity = p.position.clone().sub(p.previous).multiplyScalar(0.96);
        p.position.add(frameVelocity).add(p.acceleration.multiplyScalar(TIMESTEP * TIMESTEP));
        p.previous = currentPos;
        p.acceleration.set(0, 0, 0);
    }

    for (let step = 0; step < 4; step++) {
        for (let c of fabricConstraints) {
            let nodeA = fabricParticles[c.indexA];
            let nodeB = fabricParticles[c.indexB];
            let deltaVector = nodeB.position.clone().sub(nodeA.position);
            let currentDist = deltaVector.length();
            if (currentDist === 0) continue;
            let structuralError = currentDist - c.restLength;
            let splitCorrection = deltaVector.normalize().multiplyScalar(structuralError * 0.5);
            if (!nodeA.isPinned) nodeA.position.add(splitCorrection);
            if (!nodeB.isPinned) nodeB.position.sub(splitCorrection);
        }
    }

    const positionAttribute = activeGarmentMesh.geometry.attributes.position;
    const inverseWorldMatrix = new THREE.Matrix4().copy(activeGarmentMesh.matrixWorld).invert();
    
    for (let i = 0; i < fabricParticles.length; i++) {
        let transformedLocal = fabricParticles[i].position.clone().applyMatrix4(inverseWorldMatrix);
        positionAttribute.setXYZ(i, transformedLocal.x, transformedLocal.y, transformedLocal.z);
    }
    
    positionAttribute.needsUpdate = true;
    activeGarmentMesh.geometry.computeVertexNormals();
}

/* ============================================================
   CONFIG
   ============================================================ */
// Tries each path in order, so it works whether the file is in /models or next to this page.
const MODEL_URLS = ["models/tshirt.glb", "tshirt.glb"];
const GARMENT_HEIGHT = 2.2;
const RAIL_Y = 1.75;
const SPACING = 2.5;

const GARMENTS = [
  { name: "Mazin Atelier 'Obsidian' Core Tee", price: "$185", color: 0x1a1a1a, roughness: 0.75, metalness: 0.1, clearcoat: 0.0 },
  { name: "Mazin Atelier 'Aura' Purple Tee",   price: "$210", color: 0x805ad5, roughness: 0.65, metalness: 0.2, clearcoat: 0.1 },
  { name: "Mazin Atelier 'Alabaster' Tee",     price: "$195", color: 0xf7fafc, roughness: 0.80, metalness: 0.0, clearcoat: 0.0 }
];

/* ============================================================
   DOM
   ============================================================ */
const canvas = document.getElementById("stage");
const hud = document.getElementById("price-tag-hud");
const hudName = hud.querySelector(".name");
const hudPrice = hud.querySelector(".price");
const statusEl = document.getElementById("status");
const prevBtn = document.getElementById("prev-garment");
const nextBtn = document.getElementById("next-garment");

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d2c8);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
const LOOK_AT = new THREE.Vector3(0, 0.8, 0);

let activeIndex = 0;
let camX = 0;            // eased camera x
let targetCamX = 0;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

/* ============================================================
   LIGHTS
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8afa2, 1.0));

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3, 6, 6);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 6;   key.shadow.camera.bottom = -4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xfff1de, 0.7);
fill.position.set(-5, 2, 4);
scene.add(fill);

/* ============================================================
   RAIL
   ============================================================ */
const railLength = (GARMENTS.length - 1) * SPACING + 4;
const rail = new THREE.Mesh(
  new THREE.CylinderGeometry(0.035, 0.035, railLength, 24),
  new THREE.MeshStandardMaterial({ color: 0x2b2824, metalness: 0.8, roughness: 0.35 })
);
rail.rotation.z = Math.PI / 2;
rail.position.set(0, RAIL_Y + 0.12, 0);
scene.add(rail);

/* ============================================================
   GARMENTS
   ============================================================ */
const pivots = [];
const hoverables = [];

function makeHanger() {
  const g = new THREE.Group();
  const metal = new THREE.MeshStandardMaterial({ color: 0x2b2824, metalness: 0.8, roughness: 0.35 });
  const hook = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.012, 8, 24, Math.PI * 1.5), metal);
  hook.position.y = 0.19;
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.1, 8), metal);
  stem.position.y = 0.07;
  g.add(hook, stem);
  return g;
}

function buildGarment(source, index) {
  const data = GARMENTS[index];
  const pivot = new THREE.Group();
  pivot.position.set((index - (GARMENTS.length - 1) / 2) * SPACING, RAIL_Y, 0);
  pivot.userData = { index, hover: 0, spin: 0, phase: Math.random() * Math.PI * 2 };
  pivot.add(makeHanger());

  const model = source.clone(true);

  // Scale to a fixed height, then pin the TOP of the mesh to the pivot (0,0,0).
  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3(), center = new THREE.Vector3();
  box.getSize(size); box.getCenter(center);
  const s = GARMENT_HEIGHT / (size.y || 1);
  model.scale.setScalar(s);
  model.position.set(-center.x * s, -box.max.y * s, -center.z * s);

  const material = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(data.color),
    roughness: data.roughness,
    metalness: data.metalness,
    clearcoat: data.clearcoat,
    sheen: 1.0,
    sheenRoughness: 0.8,
    sheenColor: new THREE.Color(0xffffff),
    side: THREE.DoubleSide,
    shadowSide: THREE.DoubleSide
  });

  model.traverse((o) => {
    if (o.isMesh) {
      o.material = material;
      o.castShadow = true;
      o.receiveShadow = true;
      o.userData.pivot = pivot;
      hoverables.push(o);
    }
  });

  pivot.add(model);
  scene.add(pivot);
  pivots.push(pivot);
}

function makeFallback() {
  const geo = new THREE.CylinderGeometry(0.55, 0.62, 1, 32, 1, true);
  geo.translate(0, -0.5, 0);
  const g = new THREE.Group(); g.add(new THREE.Mesh(geo));
  return g;
}

function buildAll(source) {
  GARMENTS.forEach((_, i) => buildGarment(source, i));
  setActive(0);
}

function loadModel(urls) {
  const url = urls[0];
  new GLTFLoader().load(
        url,
        (gltf) => {
            statusEl.style.display = "none";
            GARMENTS.forEach((garment, i) => {
                loadLuxuryGarments(scene, garment.color); 
            });
        },
        undefined,
    (err) => {
      console.warn("Could not load " + url, err);
      if (urls.length > 1) { loadModel(urls.slice(1)); return; }
      buildAll(makeFallback());
      statusEl.className = "error";
      statusEl.textContent = "Couldn’t find tshirt.glb (tried " + MODEL_URLS.join(", ") + "). Showing placeholders.";
    }
  );
}
loadModel(MODEL_URLS);

/* ============================================================
   NAVIGATION (buttons + arrow keys)
   ============================================================ */
function setActive(i) {
  const n = GARMENTS.length;
  activeIndex = ((i % n) + n) % n;
  const p = pivots[activeIndex];
  if (p) targetCamX = p.position.x * 0.6;
}
prevBtn.addEventListener("click", () => setActive(activeIndex - 1));
nextBtn.addEventListener("click", () => setActive(activeIndex + 1));
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") setActive(activeIndex - 1);
  if (e.key === "ArrowRight") setActive(activeIndex + 1);
});

/* ============================================================
   POINTER + RAYCASTER + HUD
   ============================================================ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2(0, 0);
const smoothNdc = new THREE.Vector2(0, 0);
const hudPos = { x: 0, y: 0, tx: 0, ty: 0 };
let hovered = null;
let pointerSeen = false;

function onPointer(e) {
  ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
  hudPos.tx = e.clientX + 18;
  hudPos.ty = e.clientY + 18;
  if (!pointerSeen) { hudPos.x = hudPos.tx; hudPos.y = hudPos.ty; pointerSeen = true; }
}
window.addEventListener("pointermove", onPointer, { passive: true });
window.addEventListener("pointerdown", onPointer, { passive: true });
document.addEventListener("pointerleave", () => { ndc.set(0, 0); setHover(null); });

function setHover(pivot) {
  if (pivot === hovered) return;
  hovered = pivot;
  if (pivot) {
    const d = GARMENTS[pivot.userData.index];
    hudName.textContent = d.name;
    hudPrice.textContent = d.price;
    hud.classList.add("visible");
    canvas.style.cursor = "pointer";
  } else {
    hud.classList.remove("visible");
    canvas.style.cursor = "default";
  }
}

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const clock = new THREE.Clock();
const lerp = (a, b, t) => a + (b - a) * t;

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.getElapsedTime();
    const k = 1 - Math.pow(0.001, dt);

    runBoutiqueFrameUpdate(); // <--- This line is now successfully active!

    smoothMdc.x = lerp(smoothMdc.x, mdc.x, k * 0.6);
    smoothMdc.y = lerp(smoothMdc.y, mdc.y, k * 0.6);


  // Camera glides to the selected garment
  camX = lerp(camX, targetCamX, k * 0.8);
  camera.position.set(camX, 1.2, 9.5);
  camera.lookAt(LOOK_AT.x + camX, LOOK_AT.y, LOOK_AT.z);

  // Raycast
  if (pivots.length && pointerSeen) {
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObjects(hoverables, false)[0];
    setHover(hit ? hit.object.userData.pivot : null);
  }

  pivots.forEach((p) => {
    const isHover = p === hovered;
    const isActive = p.userData.index === activeIndex;
    p.userData.hover = lerp(p.userData.hover, isHover ? 1 : 0, k * 1.2);
    const h = p.userData.hover;

    const dx = smoothNdc.x - (p.position.x - camX) / 5;
    const turnToCursor = THREE.MathUtils.clamp(dx, -1, 1) * 0.5;
    const sway = reduceMotion ? 0 : Math.sin(t * 0.8 + p.userData.phase) * 0.05;
    if (isHover && !reduceMotion) p.userData.spin += dt * 1.1;

    p.rotation.y = turnToCursor + sway + p.userData.spin * h;
    p.rotation.z = lerp(p.rotation.z, -smoothNdc.x * 0.08 * (0.4 + h), k);
    p.rotation.x = lerp(p.rotation.x, smoothNdc.y * 0.06, k);

    p.scale.setScalar(lerp(p.scale.x, 1 + h * 0.07 + (isActive ? 0.04 : 0), k));
  });

  // Smooth HUD follow
  hudPos.x = lerp(hudPos.x, hudPos.tx, k * 1.5);
  hudPos.y = lerp(hudPos.y, hudPos.ty, k * 1.5);
  const maxX = window.innerWidth - hud.offsetWidth - 8;
  const maxY = window.innerHeight - hud.offsetHeight - 8;
  hud.style.transform =
    "translate3d(" + Math.min(hudPos.x, maxX).toFixed(1) + "px," + Math.min(hudPos.y, maxY).toFixed(1) + "px,0)";

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
