<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mazin Atelier — Boutique</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://googleapis.com" rel="stylesheet">

<style>
  :root {
    --wall: #d8d2c8;
    --ink: #23201c;
    --muted: #6d655b;
    --tag: #23201c;
    --tag-text: #f3efe8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--wall); }
  body { font-family: "Jost", system-ui, sans-serif; color: var(--ink); }

  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 22px 28px; pointer-events: none;
  }
  header a { pointer-events: auto; color: inherit; text-decoration: none; }
  .wordmark { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.7rem; font-weight: 600; letter-spacing: .02em; }
  .hint { font-size: .9rem; color: var(--muted); }

  #price-tag-hud {
    position: fixed; top: 0; left: 0; z-index: 10;
    pointer-events: none; opacity: 0;
    transition: opacity .18s ease;
    background: var(--tag); color: var(--tag-text);
    padding: 10px 14px; border-radius: 3px;
    min-width: 120px; white-space: nowrap;
    will-change: transform;
  }
  #price-tag-hud.visible { opacity: 1; }
  #price-tag-hud .name { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.15rem; font-weight: 600; line-height: 1.1; }
  #price-tag-hud .price { font-size: .95rem; margin-top: 3px; }

  #status {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 6; font-size: .9rem; color: var(--muted);
    text-align: center; max-width: 90vw;
  }
  #status.error { color: #8a1f1f; }

  /* 🔗 LINE 51: Styles for the newly injected UI navigation button overlay layout container */
  .storefront-navigation {
    position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%);
    z-index: 20; display: flex; gap: 24px;
  }
  .nav-btn {
    background: var(--ink); color: var(--tag-text); border: 1px solid rgba(255,255,255,0.15);
    font-family: "Jost", sans-serif; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.12em;
    padding: 12px 26px; cursor: pointer; border-radius: 2px; transition: all 0.2s ease;
  }
  .nav-btn:hover { background: #3e3832; transform: translateY(-2px); }

  @media (prefers-reduced-motion: reduce) { #price-tag-hud { transition: none; } }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<header>
  <a href="index.html" class="wordmark">Mazin Atelier</a>
  <span class="hint">Move your cursor across the rail or use controls</span>
</header>

<canvas id="stage"></canvas>

<div id="price-tag-hud" aria-hidden="true">
  <div class="name"></div>
  <div class="price"></div>
</div>

<!-- 🔗 LINES 91–94: Added interactive storefront desktop hardware navigation triggers -->
<div class="storefront-navigation">
  <button id="prev-garment" class="nav-btn">← PREVIOUS</button>
  <button id="next-garment" class="nav-btn">NEXT →</button>
</div>

<div id="status">Loading garments…</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* ============================================================
   CONFIG — edit these
   ============================================================ */
const MODEL_URL = "models/tshirt.glb";        
const GARMENT_HEIGHT = 2.2;            
const RAIL_Y = 1.75;                   
const SPACING = 2.5;                   

// 🔗 LINES 114–118: Augmented item schema variant parameters map matrix
const GARMENTS = [
    { name: "Mazin Atelier 'Obsidian' Core Tee", price: "$185", color: 0x1a1a1a, roughness: 0.75, metalness: 0.1, clearcoat: 0.0 },
    { name: "Mazin Atelier 'Aura' Purple Tee",  price: "$210", color: 0x805ad5, roughness: 0.65, metalness: 0.2, clearcoat: 0.1 },
    { name: "Mazin Atelier 'Alabaster' Tee",     price: "$195", color: 0xf7fafc, roughness: 0.80, metalness: 0.0, clearcoat: 0.0 }
];

/* ============================================================
   DOM
   ============================================================ */
const canvas = document.getElementById("stage");
const hud = document.getElementById("price-tag-hud");
const hudName = hud.querySelector(".name");
const hudPrice = hud.querySelector(".price");
const statusEl = document.getElementById("status");

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d2c8);   

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
const LOOK_AT = new THREE.Vector3(0, 0.8, 0);

// Global State Trackers
let activeSelectionIndex = 0;
let targetCameraX = 0;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.position.set(targetCameraX, 1.2, 9.5);
  camera.lookAt(LOOK_AT);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

/* ============================================================
   LIGHTS
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8afa2, 1.0));

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3, 6, 6);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 6;   key.shadow.camera.bottom = -4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xfff1de, 0.7);
fill.position.set(-5, 2, 4);
scene.add(fill);

/* ============================================================
   RAIL
   ============================================================ */
const railLength = (GARMENTS.length - 1) * SPACING + 4;
const rail = new THREE.Mesh(
  new THREE.CylinderGeometry(0.035, 0.035, railLength, 24),
  new THREE.MeshStandardMaterial({ color: 0x2b2824, metalness: 0.8, roughness: 0.35 })
);
rail.rotation.z = Math.PI / 2;
rail.position.set(0, RAIL_Y + 0.12, 0);
scene.add(rail);

/* ============================================================
   GARMENTS
   ============================================================ */
const pivots = [];            
const hoverables = [];        
const mouse = new THREE.Vector2(-999, -999);
const raycaster = new THREE.Raycaster();

function makeHanger() {
  const g = new THREE.Group();
  const metal = new THREE.MeshStandardMaterial({ color: 0x2b2824, metalness: 0.8, roughness: 0.35 });
  const hook = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.012, 8, 24, Math.PI * 1.5), metal);
  hook.position.y = 0.19;
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.1, 8), metal);
  stem.position.y = 0.07;
  g.add(hook, stem);
  return g;
}

function buildGarment(source, index) {
  const data = GARMENTS[index];
  const pivot = new THREE.Group();
  
  // Center array symmetrically on coordinate system zero axis
  const posX = (index - (GARMENTS.length - 1) / 2) * SPACING;
  pivot.position.set(posX, RAIL_Y, 0);
  pivot.userData = { index, hover: 0, spin: 0, phase: Math.random() * Math.PI * 2 };

  // Generate Hanger
  const hanger = makeHanger();
  pivot.add(hanger);

  const model = source.clone(true);

  // Normalize size matrix scale properties safely
  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3(); 
  box.getSize(size);
  const s = GARMENT_HEIGHT / (size.y || 1);
  model.scale.setScalar(s);
  model.position.y = -GARMENT_HEIGHT;

  // 🔗 LINES 227–239: Pasted and integrated custom luxury fabric physical shader setup
  const material = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(data.color),
      roughness: data.roughness,
      metalness: data.metalness,
      clearcoat: data.clearcoat,
      sheen: 1.0,
      sheenRoughness: 0.8,
      sheenColor: new THREE.Color(0xffffff),
      side: THREE.DoubleSide,
      shadowSide: THREE.DoubleSide
  });

  // Traverse model sub-tree tree structure nodes
  model.traverse((o) => {
      if (o.isMesh) {
          o.material = material;
          o.castShadow = true;
          o.receiveShadow = true;
          o.userData.pivot = pivot; // Reference parent node
          hoverables.push(o);
      }
  });

  pivot.add(model);
  scene.add(pivot);
  pivots.push(pivot);
}

/* ============================================================
   ASSET PIPELINE INITIALIZATION
   ============================================================ */
const loader = new GLTFLoader();
loader.load(
  MODEL_URL,
  (gltf) => {
      statusEl.style.display = "none";
      const baseSource = gltf.scene;
      
      // Map catalog indexes loop execution
      for(let i = 0; i < GARMENTS.length; i++) {
          buildGarment(baseSource, i);
      }
      resize();
  },
  undefined,
  (err) => {
      console.error("Asset pipeline loading error event context:", err);
      statusEl.innerText = "Error loading 3D assets pipeline links.";
      statusEl.className = "error";
  }
);
